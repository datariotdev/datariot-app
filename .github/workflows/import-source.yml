name: Import application source
on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy application from existing public monorepo
        run: |
          git clone --depth 1 https://github.com/datariotdev/datariot-site.git /tmp/datariot-source
          for p in src android ios assets scripts package.json package-lock.json app.json babel.config.js metro-entry.js tsconfig.json tailwind.config.js eslint.config.js vercel.json .gitignore; do
            cp -a "/tmp/datariot-source/$p" "./$p"
          done
          rm -f android/app/debug.keystore ios/.xcode.env
          rm -rf migration
      - name: Commit imported application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import Expo app source from datariot-site"
          git push
