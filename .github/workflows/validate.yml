name: Validate app
on:
  pull_request:
    paths:
      - '.github/workflows/validate.yml'
      - 'src/**'
      - 'scripts/test-user-search.cjs'
      - 'package*.json'
  push:
    paths:
      - '.github/workflows/validate.yml'
      - 'src/**'
      - 'scripts/test-user-search.cjs'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Repair and validate dependency lockfile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - name: User search regression tests
        run: node scripts/test-user-search.cjs
      - name: TypeScript check
        run: npx tsc --noEmit
